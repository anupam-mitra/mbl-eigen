[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbl-eigen"
version = "0.1.0"
description = "Many-body localization and quantum scar analysis scripts"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
  "matplotlib>=3.7,<4",
  "qutip>=5,<6",
  "qutip-qip>=0.4,<1",
  "h5py>=3.8,<4",
]

[project.urls]
Homepage = "https://github.com/anupam-mitra/mbl-eigen"
Repository = "https://github.com/anupam-mitra/mbl-eigen.git"

[project.optional-dependencies]
torch = [
  "torch>=2,<3",
]
jax = [
  "jax>=0.4,<1",
  "jaxlib>=0.4,<1",
]
qiskit = [
  "qiskit>=1,<3",
  "qiskit-aer>=0.15,<3",
  "qiskit-ibm-runtime>=0.30,<1",
]
dev = [
  "jupyter>=1,<2",
]

[project.scripts]
mbl-eigen-qmbs = "mbl_eigen.cli:main_qmbs"
mbl-eigen-mbldtc = "mbl_eigen.cli:main_mbldtc"
mbl-eigen-mbl = "mbl_eigen.cli:main_mbl"
mbl-eigen-mbl-dynamics = "mbl_eigen.cli:main_mbl_dynamics"
mbl-eigen-mbl-propagator = "mbl_eigen.cli:main_mbl_propagator"
mbl-eigen-qiskit-sim = "mbl_eigen.cli:main_qiskit_sim"

[tool.setuptools.packages.find]
include = ["mbl_eigen*"]
