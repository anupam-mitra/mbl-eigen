[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbl-eigen"
version = "0.1.0"
description = "Many-body localization and quantum scar analysis scripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
  "matplotlib>=3.7,<4",
  "qutip>=5,<6",
  "qutip-qip>=0.4,<1",
  "jupyter>=1,<2",
  "h5py>=3.8,<4",
]

[project.optional-dependencies]
torch = [
  "torch>=2,<3",
]
jax = [
  "jax>=0.4,<1",
  "jaxlib>=0.4,<1",
]
qiskit = [
  "qiskit>=1,<3",
  "qiskit-aer>=1,<3",
]

[tool.setuptools.packages.find]
include = ["mbl_eigen*"]
